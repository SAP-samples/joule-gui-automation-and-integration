action_groups:
  - actions:
      - type: message
        message:
          type: text         
          content: "agent start"
      - type: agent-request
        name: screen_summarizer
        body:
          message: "Summarize the SAP GUI screen"
        result_variable: agentResponse
      - type: message
        message:
          type: text
          markdown: true
          content: "<? agentResponse.body.message ?>"
