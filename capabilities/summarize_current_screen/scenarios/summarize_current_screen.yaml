description: >
  Summarizes what is currently shown on the SAP GUI screen. Returns a readable overview
  of the screen title, input fields with their values, active tabs, and available buttons.
  No parameters needed — the user simply asks to summarize or describe the current screen.

title: Summarize current screen

conversation_starter:
  trigger_utterance: Summarize the current SAP GUI screen.

target:
  type: function
  name: summarize_current_screen
