  # Step 3: Call AI Core to compare trees and return structured JSON result
  - actions:
      - type: api-request
        method: POST
        system_alias: AOKExtractAgent
        path: /odata/v4/ai/completeJson
        timeout: 45
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body:
          {"request": {
            "prompt": "You are an expert in comparing UI tree structures from SAP GUI applications. Compare the ACTUAL UI tree against the REFERENCE UI tree.\n\nRules:\n- Compare each element by Id, Type, Text, Changeable, LeftLabel, Tooltip properties\n- COMPLETELY IGNORE any element whose Id contains 'PRODUCT_ID' or 'PRODUCT_HEADER_200-PRODUCT_ID'. This field has dynamic values (e.g. 'HT-12324' vs '*') and must NEVER be reported as a difference. Skip it entirely.\n- A mismatch means values are ACTUALLY DIFFERENT after trimming whitespace. If expected='Foo' and found='Foo', that is NOT a mismatch — skip it\n- Track: missing elements (in reference but not actual), extra elements (in actual but not reference), property mismatches (truly different values only)\n- Elements with short Ids like '.../lbl%#AUTOTEXT012' in the reference match full Ids in the actual tree that end with the same suffix\n\nReturn a flat JSON object with these exact keys:\n{\"status\":\"SAME or DIFFERENT\",\"summary\":\"one sentence summary\",\"totalElements\":\"N\",\"matched\":\"N\",\"mismatched\":\"N\",\"missingCount\":\"N\",\"extraCount\":\"N\",\"differences\":\"bullet point list of real differences or No differences found.\"}\n\nAll values MUST be strings. Return ONLY the JSON object, no markdown, no code blocks, no other text.\n\n--- ACTUAL UI TREE ---\n<? currentTree ?>\n\n--- REFERENCE UI TREE ---\n<? referenceTree ?>"
          }}
        result_variable: comparisonResponse
      - type: set-variables
        variables:
          - name: comparison
            value: <? comparisonResponse.body ?>
      - type: message
        message:
          type: list
          content:
            title: "UI Tree Comparison"
            total: 4
            imageUrl: sap-icon://compare
            imageStyle: avatar
            subtitle: "<? comparison.summary ?>"
            elements:
              - title: "<? comparison.status ?>"
                subtitle: "Vergleichsergebnis"
                imageUrl: sap-icon://accept
                imageStyle: avatar
                sections:
                  - title: "Details"
                    attributes:
                      - label: "Ergebnis"
                        value: "<? comparison.status ?>"
                      - label: "Zusammenfassung"
                        value: "<? comparison.summary ?>"
              - title: "Statistiken"
                subtitle: "Element-Vergleich"
                imageUrl: sap-icon://bar-chart
                imageStyle: avatar
                sections:
                  - title: "Details"
                    attributes:
                      - label: "Gesamt"
                        value: "<? comparison.totalElements ?>"
                      - label: "Uebereinstimmend"
                        value: "<? comparison.matched ?>"
                      - label: "Abweichend"
                        value: "<? comparison.mismatched ?>"
                      - label: "Fehlend"
                        value: "<? comparison.missingCount ?>"
                      - label: "Zusaetzlich"
                        value: "<? comparison.extraCount ?>"
              - title: "Unterschiede"
                subtitle: "Gefundene Abweichungen"
                imageUrl: sap-icon://alert
                imageStyle: avatar
                sections:
                  - title: "Details"
                    attributes:
                      - label: "Beschreibung"
                        value: "<? comparison.differences ?>"
              - title: "DescribeUI Output"
                subtitle: "Rohdaten der UI-Beschreibung"
                imageUrl: sap-icon://syntax
                imageStyle: avatar
                sections:
                  - title: "Details"
                    attributes:
                      - label: "UI Tree"
                        value: "<? currentTree ?>"

result:
  comparisonResult: <? comparisonResponse.body ?>
