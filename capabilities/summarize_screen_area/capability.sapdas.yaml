schema_version: 3.29.0

metadata:
  namespace: com.sap.das.demo
  display_name: "Summarize screen area"
  name: summarize_screen_area
  version: 1.0.0
  description: Summary of a chosen UI area of the current SAP GUI screen. The user provides a root element ID (e.g. wnd[0] for the whole window, wnd[0]/usr for the user area, or a specific container path) and the describeUI frontend action captures that subtree including table rows and tree node hierarchies, then renders it as readable markdown.
