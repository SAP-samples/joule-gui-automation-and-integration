parameters:
  - name: root_element_id

action_groups:
  - actions:
      - type: set-variables
        variables:
          - name: effective_root_id
            value: "<? root_element_id != null && root_element_id != '' ? root_element_id : 'wnd[0]' ?>"
      - type: agent-request
        agent: screen_area_summarizer
        parameters:
          - name: root_element_id
            value: <? effective_root_id ?>
        result_variable: agentResponse
      - type: message
        message:
          type: text
          markdown: true
          content: "<? agentResponse.body.content ?>"
