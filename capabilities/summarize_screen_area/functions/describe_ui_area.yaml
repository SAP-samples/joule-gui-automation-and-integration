parameters:
  - name: root_element_id

action_groups:
  - actions:
      - type: frontend-action
        name: com.sap.uic.unified.frontend.actions.describeUI
        parameters:
          - name: root_element_id
            value: <? root_element_id ?>
          - name: properties
            value: '["id", "type", "text", "tooltip", "leftLabel", "changeable", "rowCount", "columnCount", "selectedRows"]'
        result_variable: describeUIResult

result:
  status: <? describeUIResult.status ?>
  content: <? describeUIResult.content ?>
